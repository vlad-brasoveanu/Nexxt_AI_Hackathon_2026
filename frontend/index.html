<!doctype html>
<html lang="ro" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CaseCheck — analiza documentelor, verificarea datelor și decizii de credit IMM." />
    <meta name="color-scheme" content="dark light" />
    <title>CaseCheck · Analiza dosarelor de credit</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Cpath d='M2 2h18l6 6v18H2z' fill='%230a0a0b' stroke='%23ededed' stroke-width='1.6'/%3E%3Cpath d='M8 14.5l4 4 8-9' stroke='%232563EB' stroke-width='3' fill='none'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the stored (or OS) theme before first paint to avoid a flash. Storage can be blocked.
      (function () {
        var theme = "dark";
        try {
          var stored = window.localStorage.getItem("casecheck-theme");
          if (stored === "light" || stored === "dark") theme = stored;
          else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) theme = "light";
        } catch (e) {
          try {
            if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) theme = "light";
          } catch (e2) {}
        }
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <style>
      html[data-theme="dark"] { background: #1C2027; }
      html[data-theme="light"] { background: #F1F4F8; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
